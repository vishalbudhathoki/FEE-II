<!-- login page -->

<!-- 8 character password -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="nav">
           <div>Login Page</div>
            <a>Home</a>
            <a>About</a>
            <a>Contact</a>
            <button class="notification" type="button" aria-label="Notifications">
                <span class="bell-icon" aria-hidden="true">&#128276;</span>
                <span class="notification-badge">1</span>
            </button>
    </nav>
    <div class="outside">
        <div class="formm">
            <button class="close-button" type="button" aria-label="Close login form">&times;</button>
             <form class="inp">
                <input type="email" id="useremail" name="useremail" placeholder="Email" aria-label="Email" required>

                <div class="password-box">
                    <input type="password" id="userpass" name="userpass" placeholder="Password" aria-label="Password" minlength="8" maxlength="8" required>
                    <span class="heart-icon" aria-hidden="true">&#9829;</span>
                    <span class="password-note">Password must be 8 characters</span>
                </div>
                <a class="forgot-password" href="#">Forgot password?</a>
                <button type="submit">Login</button>
                <p class="signup-text">
                    Don't have an account? <a class="signup-link" href="#">Sign up</a>
                </p>
             </form>
        </div>
    </div>    
</body>
</html>
